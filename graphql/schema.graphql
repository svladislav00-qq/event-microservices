# =========================
# SCALARS
# =========================
scalar Time
scalar Upload

# =========================
# ENUMS
# =========================
enum Role {
  USER
  MODERATOR
  ADMIN
}

enum Status {
  UNKNOWN
  REGISTERED
  CANCELED
}

# =========================
# TYPES (MODELS)
# =========================
type Account {
  id: ID!
  email: String!
  username: String!
  role: Role!
  department: String
  createdAt: Time!
  updatedAt: Time!
  deletedAt: Time
}

type Event {
  id: ID!
  name: String!
  description: String!
  department: String!
  createdBy: String!
  startTime: Time!
  endTime: Time!
  createdAt: Time!
  capacity: Int
  fileUrls: [String!]
}

type Attendee {
  id: String!
  eventID: String!
  userID: String!
  status: Status!
  registeredAt: Time
}

type MyEvent {
  eventID: String!
  status: Status!
  registeredAt: Time!
}

# =========================
# RESPONSE / PAYLOAD TYPES
# =========================
type AuthPayload {
  token: String!
}

type UploadFileResponse {
  uploadUrl: String!
  fileKey: String!
}

type ExcelFile {
  filename: String!
  content: String!
}

# =========================
# INPUT TYPES
# =========================
input RegisterInput {
  email: String!
  password: String!
  username: String!
}

input LoginInput {
  email: String!
  password: String!
}

input PromoteToModeratorInput {
  id: ID!
  department: String!
}

input CreateEventInput {
  name: String!
  description: String!
  startTime: Time!
  endTime: Time!
  capacity: Int
}

input UpdateEventInput {
  id: ID!
  name: String
  description: String
  startTime: Time
  endTime: Time
  capacity: Int
}

input DeleteEventInput {
  id: ID!
}

input GetEventInput {
  id: ID!
}

input GetEventsInput {
  skip: Int
  take: Int
}

input GetUserRegistrationsInput {
  skip: Int
  take: Int
}

input EventIDInput {
  eventID: ID!
}

input GetEventAttendeesInput {
  eventID: ID!
  skip: Int
  take: Int
}

# =========================
# QUERY
# =========================
type Query {
  # auth
  ping: String!
  me: Account!

  # event
  getEvent(input: GetEventInput!): Event!
  getEvents(input: GetEventsInput!): [Event!]!

  # attendee
  getUserRegistrations(input: GetUserRegistrationsInput!): [MyEvent!]!
  getEventAttendees(input: GetEventAttendeesInput!): [Attendee!]!
  exportAttendeesTable(eventID: ID!): ExcelFile!
}

# =========================
# MUTATION
# =========================
type Mutation {
  # auth
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): Account!
  promoteToModerator(input: PromoteToModeratorInput!): Account!

  # event
  createEvent(input: CreateEventInput!): Event!
  updateEvent(input: UpdateEventInput!): Event!
  deleteEvent(input: DeleteEventInput!): Boolean!
  uploadFiles(id: ID!, files: [Upload!]!): [UploadFileResponse!]!

  # attendee
  registerToEvent(input: EventIDInput!): Attendee!
  cancelRegistration(input: EventIDInput!): Boolean!
}