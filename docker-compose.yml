

services:
  postgres:
    image: postgres:15
    container_name: event_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro

  minio:
    image: minio/minio
    container_name: event_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth:
    build:
      context: .
      dockerfile: auth/app.dockerfile
    container_name: auth_service
    env_file:
      - ./auth/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "44044:44044"

  event:
    build:
      context: .
      dockerfile: event/app.dockerfile
    container_name: event_service
    env_file:
      - ./event/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "44045:44045"

  attendee:
    build:
      context: .
      dockerfile: attendee/app.dockerfile
    container_name: attendee_service
    env_file:
      - ./attendee/.env
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped
    ports:
      - "44046:44046"

  graphql:
    build:
      context: .
      dockerfile: graphql/app.dockerfile
    container_name: graphql_gateway
    env_file:
      - ./graphql/.env
    depends_on:
      auth:
        condition: service_started
      event:
        condition: service_started
      attendee:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
